{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "poster.fullname" . }}-strip-poster-prefix
  namespace: {{ .Values.namespace }}
spec:
  stripPrefix:
    prefixes:
      - /poster
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "poster.fullname" . }}-private-only
  namespace: {{ .Values.namespace }}
spec:
  ipAllowList:
    sourceRange:
      {{- toYaml .Values.ingress.privateSourceRanges | nindent 6 }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "poster.fullname" . }}-private-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "poster.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.namespace }}-{{ include "poster.fullname" . }}-strip-poster-prefix@kubernetescrd,{{ .Values.namespace }}-{{ include "poster.fullname" . }}-private-only@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /poster
            pathType: Prefix
            backend:
              service:
                name: {{ include "poster.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
