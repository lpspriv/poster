{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "poster.fullname" . }}-strip-poster-prefix
  namespace: {{ .Release.Namespace }}
spec:
  stripPrefix:
    prefixes:
      - /poster
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "poster.fullname" . }}-cors
  namespace: {{ .Release.Namespace }}
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - POST
      - OPTIONS
    accessControlAllowHeaders:
      - Authorization
      - Content-Type
    accessControlAllowOriginList:
      - https://lpspriv.com
      - https://www.lpspriv.com
    accessControlMaxAge: 600
    addVaryHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "poster.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
spec:
  basicAuth:
    secret: {{ .Values.ingress.authSecretName }}
    removeHeader: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "poster.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poster.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "poster.fullname" . }}-cors@kubernetescrd,{{ .Release.Namespace }}-{{ include "poster.fullname" . }}-auth@kubernetescrd,{{ .Release.Namespace }}-{{ include "poster.fullname" . }}-strip-poster-prefix@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /poster
            pathType: Prefix
            backend:
              service:
                name: {{ include "poster.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
